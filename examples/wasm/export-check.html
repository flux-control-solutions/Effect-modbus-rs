<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>modbus-rs WASM export check</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        justify-content: center;
        padding: 32px 16px;
        box-sizing: border-box;
      }
      main {
        width: 100%;
        max-width: 760px;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 4px;
      }
      p.subtitle {
        color: #94a3b8;
        margin-top: 0;
      }
      a {
        color: #7dd3fc;
      }
      code {
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      .summary {
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 20px;
        font-weight: 600;
      }
      .summary-ok {
        background: rgba(34, 197, 94, 0.12);
        border: 1px solid rgba(34, 197, 94, 0.4);
        color: #86efac;
      }
      .summary-fail {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fca5a5;
      }
      .probe {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-left-width: 4px;
        border-radius: 10px;
        padding: 14px 18px;
        margin-bottom: 14px;
      }
      .probe-ok {
        border-left-color: #22c55e;
      }
      .probe-fail {
        border-left-color: #ef4444;
      }
      .probe-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      .badge {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }
      .probe-ok .badge {
        color: #86efac;
      }
      .probe-fail .badge {
        color: #fca5a5;
      }
      .probe-note {
        color: #94a3b8;
        font-size: 13px;
        margin: 0 0 10px;
      }
      .probe-detail {
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        background: rgba(15, 23, 42, 0.6);
        border-radius: 8px;
        padding: 10px;
        margin: 0;
      }
      details {
        margin-top: 10px;
      }
      summary {
        cursor: pointer;
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>modbus-rs WASM export check</h1>
      <p class="subtitle">
        Probes whether <code>modbus-rs</code>'s WASM build actually exports
        <code>ModbusErrorCode</code> at runtime, as its <code>.d.ts</code> claims. See
        <a href="/">the main example</a> and this directory's <code>README.md</code>.
      </p>

      <div id="summary" class="summary">Running probes…</div>
      <div id="results"></div>
    </main>
    <script type="module" src="/src/export-check.ts"></script>
  </body>
</html>
